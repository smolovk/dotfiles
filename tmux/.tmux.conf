set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'jaclu/tmux-menus'

run '~/.tmux/plugins/tpm/tpm'

# Enable extended keys for modern terminals
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Unbind the default prefix (Ctrl+b)
unbind C-b

# Set the new prefix to Ctrl+a
set -g prefix C-a

# Allow sending Ctrl+a to other applications (press it twice to send)
bind C-a send-prefix

# Set text to inherit parent terminal colors
set -g @floax-text-color 'default'

# Change the border to green
set -g @floax-border-color 'green'

# Reload config file and display a message
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at index 1, not 0. 
# (Zero is too far to reach on the keyboard when switching windows)
set -g base-index 1
setw -g pane-base-index 1

# Decrease command delay (prevents annoying lag when hitting Escape in Neovim)
set -sg escape-time 10

set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

set -g status-right '#T %H:%M %d-%b-%y'
# Enable Vi keys for copy mode
set-window-option -g mode-keys vi

# Use 'v' to begin selection like in Vim
bind -T copy-mode-vi v send-keys -X begin-selection

# Use 'y' to yank (copy) the selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Force default background
set -g window-style 'bg=terminal fg=terminal'
set -g window-active-style 'bg=terminal fg=terminal'

